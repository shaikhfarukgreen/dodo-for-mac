name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent "Dodo for Mac.app" DodoForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DodoForMac
          path: build/DodoForMac.zip

      # Publishes a downloadable release so the app can be installed without a GitHub login.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dodo for Mac 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/DodoForMac.zip
          body: |
            Download **DodoForMac.zip** below, unzip it, and drag **Dodo for Mac.app** into Applications.
            First launch: right-click the app → **Open** (it is not notarized by Apple).
