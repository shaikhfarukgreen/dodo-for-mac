name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent "Dodo for Mac.app" DodoForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DodoForMac
          path: build/DodoForMac.zip
